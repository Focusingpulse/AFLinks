<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetherforce Knowledge Vault</title>
    <style>
        :root {
            --bg: #0f1419;
            --surface: #1a2332;
            --surface-hover: #243447;
            --accent: #4fc3f7;
            --accent-dim: #2a6b85;
            --text: #e0e7ee;
            --text-dim: #8a9bae;
            --border: #2a3a4a;
            --category-bg: #1e2d3d;
            --shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        header {
            background: linear-gradient(135deg, #0d1b2a 0%, #1b2838 100%);
            border-bottom: 1px solid var(--border);
            padding: 20px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }
        header h1 {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 4px;
        }
        header p {
            font-size: 0.85rem;
            color: var(--text-dim);
        }
        .search-bar {
            max-width: 1000px;
            margin: 16px auto 0;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .search-bar input[type="text"] {
            flex: 1;
            padding: 10px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-bar input[type="text"]:focus {
            border-color: var(--accent);
        }
        .search-bar input[type="text"]::placeholder {
            color: var(--text-dim);
        }
        .stats {
            font-size: 0.8rem;
            color: var(--text-dim);
            white-space: nowrap;
        }
        .main-container {
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            gap: 20px;
        }
        .sidebar {
            width: 240px;
            flex-shrink: 0;
        }
        .sidebar h2 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-dim);
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }
        .category-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 70vh;
            overflow-y: auto;
        }
        .category-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s;
            font-size: 0.85rem;
            user-select: none;
        }
        .category-item:hover {
            background: var(--surface-hover);
        }
        .category-item.active {
            background: var(--accent-dim);
            color: var(--accent);
        }
        .category-count {
            font-size: 0.75rem;
            color: var(--text-dim);
            background: var(--surface);
            padding: 2px 8px;
            border-radius: 10px;
        }
        .category-item.active .category-count {
            background: rgba(79, 195, 247, 0.2);
            color: var(--accent);
        }
        .filter-section {
            margin-top: 20px;
        }
        .filter-section select {
            width: 100%;
            padding: 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 0.85rem;
            outline: none;
        }
        .content {
            flex: 1;
            min-width: 0;
        }
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .results-count {
            font-size: 0.85rem;
            color: var(--text-dim);
        }
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 12px;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            transition: border-color 0.2s, transform 0.15s;
            cursor: pointer;
            overflow: hidden;
        }
        .card:hover {
            border-color: var(--accent-dim);
            transform: translateY(-1px);
        }
        .card-title {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-categories {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 8px;
        }
        .category-tag {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 10px;
            background: var(--category-bg);
            color: var(--accent);
            border: 1px solid var(--border);
        }
        .card-meta {
            display: flex;
            gap: 12px;
            font-size: 0.75rem;
            color: var(--text-dim);
            flex-wrap: wrap;
        }
        .card-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .card-source {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-top: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-source a {
            color: var(--accent);
            text-decoration: none;
        }
        .card-source a:hover {
            text-decoration: underline;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            max-width: 700px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 24px;
        }
        .modal h2 {
            color: var(--accent);
            margin-bottom: 16px;
            font-size: 1.2rem;
        }
        .modal .modal-categories {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 16px;
        }
        .modal .modal-meta {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-dim);
        }
        .modal .modal-meta strong {
            color: var(--text);
        }
        .modal .close-btn {
            float: right;
            cursor: pointer;
            color: var(--text-dim);
            font-size: 1.5rem;
            line-height: 1;
        }
        .modal .close-btn:hover {
            color: var(--accent);
        }
        .modal .view-link {
            display: inline-block;
            margin-top: 16px;
            padding: 8px 16px;
            background: var(--accent-dim);
            color: var(--accent);
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.85rem;
        }
        .modal .view-link:hover {
            background: var(--accent);
            color: var(--bg);
        }
        .aetherforce-link {
            margin-top: 12px;
            padding: 12px;
            background: rgba(79, 195, 247, 0.08);
            border: 1px solid var(--accent-dim);
            border-radius: 8px;
            font-size: 0.8rem;
        }
        .aetherforce-link strong {
            color: var(--accent);
        }
        .loading {
            text-align: center;
            padding: 60px;
            color: var(--text-dim);
            font-size: 1rem;
        }
        .no-results {
            text-align: center;
            padding: 40px;
            color: var(--text-dim);
        }
        .clear-filters {
            font-size: 0.8rem;
            color: var(--accent);
            cursor: pointer;
            text-decoration: underline;
            margin-top: 12px;
            display: none;
        }
        .clear-filters:hover {
            color: var(--text);
        }
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
                padding: 12px;
            }
            .sidebar {
                width: 100%;
            }
            .category-list {
                max-height: none;
                flex-direction: row;
                flex-wrap: wrap;
                gap: 6px;
            }
            .category-item {
                display: inline-flex;
                padding: 6px 10px;
            }
            .results-grid {
                grid-template-columns: 1fr;
            }
            .search-bar {
                flex-direction: column;
                gap: 8px;
            }
            .stats {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Aetherforce Knowledge Vault</h1>
        <p>5,810 primary source documents — patents, papers & research from Rex Research, mapped to Aetherforce's living science taxonomy</p>
        <div class="search-bar">
            <input type="text" id="search" placeholder="Search by title, inventor, patent number, or topic..." autocomplete="off">
            <span class="stats" id="stats">Loading...</span>
        </div>
    </header>

    <div class="main-container">
        <div class="sidebar">
            <h2>Categories</h2>
            <div class="category-list" id="categoryList"></div>
            <div class="filter-section">
                <h2>Content Type</h2>
                <select id="typeFilter">
                    <option value="all">All Types</option>
                    <option value="document">Documents Only</option>
                    <option value="media">Media Only</option>
                </select>
            </div>
            <div class="clear-filters" id="clearFilters" onclick="clearAllFilters()">Clear all filters</div>
        </div>

        <div class="content">
            <div class="results-header">
                <span class="results-count" id="resultsCount"></span>
            </div>
            <div class="results-grid" id="results"></div>
            <div class="loading" id="loading">Loading index...</div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
        <div class="modal" id="modal"></div>
    </div>

    <script>
        let allData = [];
        let activeCategory = null;
        let searchTerm = '';
        let typeFilter = 'all';
        let visibleCount = 0;
        const PAGE_SIZE = 60;
        let currentPage = 0;

        // Aetherforce category -> wiki URL mapping
        const aetherforceWikiMap = {
            "Aether Physics": "aether-theories",
            "Agriculture": "regenerative-agriculture",
            "Architecture": "regenerative-agriculture",
            "Biology": "new-biology-morphic-fields",
            "Borderland Research": "aether-theories",
            "Chemistry": "material-sciences",
            "Consciousness": "aether-theories",
            "Crystals": "geometry-harmonics",
            "Electric Universe": "plasma-cosmology",
            "Fallacies of Standard Model": "standard-model-fallacies",
            "Geometry": "geometry-harmonics",
            "Goethean Science": "goethean-science",
            "Gravity": "aether-theories",
            "Language": "goethean-science",
            "Life Force": "aether-theories",
            "Light": "light-colour-optics",
            "Magnetism": "aether-theories",
            "Natural Philosophy": "goethean-science",
            "Psychotronics": "radionics-radiesthesia-psychotronics",
            "Renewable Energy": "aether-theories",
            "Suppression": "aether-theories",
            "Time": "aether-theories",
            "Water": "water-structure-memory",
            "Material Sciences": "material-sciences",
            "Transhumanism": "transhumanism-geo-engineering",
            "Energy Generation": "aether-theories",
            "Health Medicine": "new-biology-morphic-fields",
            "Transportation": "aether-theories",
            "Environmental": "water-structure-memory",
            "Construction": "material-sciences"
        };

        // Aetherforce article connections (category -> related articles on Aetherforce)
        const aetherforceArticleMap = {
            "Aether Physics": [
                "The Book of the Damned by Charles Fort",
                "Formative Powers of the Living – Wolfgang Peter"
            ],
            "Goethean Science": [
                "New Organs of Perception: Goethean Science as a Cultural Therapeutics",
                "Goethe and the Evolution of Science – Craig Holdrege",
                "All Science Must Be Rooted in Experience by Stephen Talbott",
                "Metamorphosis and Metamorphic Thinking by Craig Holdrege"
            ],
            "Geometry": [
                "Harmonics as A Science – Hans Kayser"
            ],
            "Biology": [
                "The Embryo's Eloquent Form – About the Embryology of Jaap Van Der Wal"
            ],
            "Psychotronics": [
                "Organon & Imago – Radionics, Thoughts & Resonant Patterns by H. Philippi, D. Sc."
            ]
        };

        async function loadIndex() {
            try {
                const response = await fetch('index.json');
                allData = await response.json();
                document.getElementById('loading').style.display = 'none';
                buildCategoryList();
                renderResults();
            } catch (e) {
                document.getElementById('loading').textContent = 'Error loading index: ' + e.message;
            }
        }

        function buildCategoryList() {
            const catCounts = {};
            allData.forEach(item => {
                (item.categories || []).forEach(cat => {
                    if (cat) catCounts[cat] = (catCounts[cat] || 0) + 1;
                });
            });

            const sorted = Object.entries(catCounts).sort((a, b) => b[1] - a[1]);
            const list = document.getElementById('categoryList');
            list.innerHTML = '';

            sorted.forEach(([cat, count]) => {
                const div = document.createElement('div');
                div.className = 'category-item';
                div.dataset.category = cat;
                div.innerHTML = `<span>${cat}</span><span class="category-count">${count}</span>`;
                div.onclick = () => toggleCategory(cat);
                list.appendChild(div);
            });
        }

        function toggleCategory(cat) {
            if (activeCategory === cat) {
                activeCategory = null;
            } else {
                activeCategory = cat;
            }
            document.querySelectorAll('.category-item').forEach(el => {
                el.classList.toggle('active', el.dataset.category === activeCategory);
            });
            currentPage = 0;
            renderResults();
            document.getElementById('clearFilters').style.display = (activeCategory || searchTerm || typeFilter !== 'all') ? 'block' : 'none';
        }

        function clearAllFilters() {
            activeCategory = null;
            searchTerm = '';
            typeFilter = 'all';
            document.getElementById('search').value = '';
            document.getElementById('typeFilter').value = 'all';
            document.querySelectorAll('.category-item').forEach(el => el.classList.remove('active'));
            currentPage = 0;
            renderResults();
            document.getElementById('clearFilters').style.display = 'none';
        }

        function getFiltered() {
            return allData.filter(item => {
                if (typeFilter !== 'all' && item.type !== typeFilter) return false;
                if (activeCategory && !(item.categories || []).includes(activeCategory)) return false;
                if (searchTerm) {
                    const s = searchTerm.toLowerCase();
                    const haystack = (
                        (item.title || '') + ' ' +
                        (item.filename || '') + ' ' +
                        (item.primary_person || '') + ' ' +
                        (item.patent_numbers || []).join(' ') + ' ' +
                        (item.categories || []).join(' ')
                    ).toLowerCase();
                    if (!haystack.includes(s)) return false;
                }
                return true;
            });
        }

        function renderResults() {
            const filtered = getFiltered();
            const results = document.getElementById('results');
            const countEl = document.getElementById('resultsCount');
            const statsEl = document.getElementById('stats');

            const shown = filtered.slice(0, (currentPage + 1) * PAGE_SIZE);
            visibleCount = shown.length;

            countEl.textContent = `${filtered.length} documents found`;
            statsEl.textContent = `${filtered.length} / ${allData.length} docs`;

            if (filtered.length === 0) {
                results.innerHTML = '<div class="no-results">No documents match your filters.</div>';
                return;
            }

            results.innerHTML = shown.map(item => `
                <div class="card" onclick="showDetail(${item.id})">
                    <div class="card-title">${escapeHtml(item.title || item.filename)}</div>
                    <div class="card-categories">
                        ${(item.categories || []).slice(0, 4).map(c => `<span class="category-tag">${escapeHtml(c)}</span>`).join('')}
                    </div>
                    <div class="card-meta">
                        ${item.primary_person ? `<span>👤 ${escapeHtml(item.primary_person)}</span>` : ''}
                        ${(item.patent_numbers && item.patent_numbers.length > 0) ? `<span>📋 ${escapeHtml(item.patent_numbers[0])}${item.patent_numbers.length > 1 ? ' +' + (item.patent_numbers.length - 1) : ''}</span>` : ''}
                        ${item.type === 'media' ? '<span>🎬 media</span>' : ''}
                        <span>📦 ${formatSize(item.size_bytes)}</span>
                    </div>
                </div>
            `).join('');

            // Add "load more" if there are more results
            if (visibleCount < filtered.length) {
                const loadMore = document.createElement('div');
                loadMore.style.cssText = 'grid-column: 1/-1; text-align: center; padding: 20px;';
                loadMore.innerHTML = `<a href="#" onclick="loadMore(event); return false;" style="color: var(--accent); text-decoration: none; font-size: 0.9rem;">Load more (${filtered.length - visibleCount} remaining)...</a>`;
                results.appendChild(loadMore);
            }
        }

        function loadMore(e) {
            currentPage++;
            renderResults();
        }

        function showDetail(id) {
            const item = allData.find(d => d.id === id);
            if (!item) return;

            const wikiSlug = aetherforceWikiMap[item.categories?.[0]] || '';
            const wikiUrl = wikiSlug ? `https://www.aetherforce.energy/wiki/${wikiSlug}/` : 'https://www.aetherforce.energy/aether-force-wiki/';

            // Find related Aetherforce articles
            const relatedArticles = [];
            (item.categories || []).forEach(cat => {
                if (aetherforceArticleMap[cat]) {
                    aetherforceArticleMap[cat].forEach(a => {
                        if (!relatedArticles.includes(a)) relatedArticles.push(a);
                    });
                }
            });

            const articlesHtml = relatedArticles.length > 0
                ? `<div class="aetherforce-link">
                    <strong>📚 Related Aetherforce Articles:</strong><br>
                    ${relatedArticles.map(a => `• ${escapeHtml(a)}`).join('<br>')}
                   </div>`
                : '';

            const modal = document.getElementById('modal');
            modal.innerHTML = `
                <span class="close-btn" onclick="closeModal()">&times;</span>
                <h2>${escapeHtml(item.title || item.filename)}</h2>
                <div class="modal-categories">
                    ${(item.categories || []).map(c => `<span class="category-tag">${escapeHtml(c)}</span>`).join('')}
                </div>
                <div class="modal-meta">
                    ${item.primary_person ? `<div><strong>Researcher/Inventor:</strong> ${escapeHtml(item.primary_person)}</div>` : ''}
                    ${(item.patent_numbers && item.patent_numbers.length > 0) ? `<div><strong>Patent Numbers:</strong> ${(item.patent_numbers || []).map(p => escapeHtml(p)).join(', ')}</div>` : ''}
                    <div><strong>File:</strong> ${escapeHtml(item.filename)}</div>
                    <div><strong>Size:</strong> ${formatSize(item.size_bytes)}</div>
                    <div><strong>Type:</strong> ${item.type}</div>
                    ${item.source_url ? `<div><strong>Source:</strong> <a href="${escapeHtml(item.source_url)}" target="_blank">${escapeHtml(item.source_url)}</a></div>` : ''}
                </div>
                <a class="view-link" href="docs/${encodeURIComponent(item.filename)}" target="_blank">View Document →</a>
                <div class="aetherforce-link">
                    <strong>🔗 Aetherforce Wiki:</strong><br>
                    This document is categorized under: ${(item.categories || []).join(', ') || 'Uncategorized'}<br>
                    <a href="${wikiUrl}" target="_blank" style="color: var(--accent);">Browse related content on Aetherforce →</a>
                </div>
                ${articlesHtml}
            `;
            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeModal(e) {
            if (e && e.target !== document.getElementById('modalOverlay')) return;
            document.getElementById('modalOverlay').classList.remove('active');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        // Event listeners
        let searchTimeout;
        document.getElementById('search').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                searchTerm = e.target.value.trim();
                currentPage = 0;
                renderResults();
                document.getElementById('clearFilters').style.display = (activeCategory || searchTerm || typeFilter !== 'all') ? 'block' : 'none';
            }, 200);
        });

        document.getElementById('typeFilter').addEventListener('change', (e) => {
            typeFilter = e.target.value;
            currentPage = 0;
            renderResults();
            document.getElementById('clearFilters').style.display = (activeCategory || searchTerm || typeFilter !== 'all') ? 'block' : 'none';
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // Load on start
        loadIndex();
    </script>
</body>
</html>
