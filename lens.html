:root {
  --bg: #0a0a12;
  --bg2: #12121e;
  --card: #1a1a2e;
  --card-hi: #22223a;
  --text: #e0e0f0;
  --text-dim: #8888aa;
  --text-faint: #444466;
  --accent: #d4a843;
  --accent2: #6b8fce;
  --accent3: #c05050;
  --border: #2a2a44;

* { margin:0; padding:0; box-sizing:border-box; }

}

}

  border-color: var(--accent-dim);
}

/* === Goethean Walk — one continuous spectrum, seven lens stops === */
        /* [aesthetic] A reading instrument, not an optical reproduction.
           Newton's band runs left→right on top; the Goethean (inverted)
           arrangement runs beneath it. Where the two disagree at the ends the
           boundary color appears — green at one seam, magenta at the other. */
        .walk-wrap {
            max-width: 780px;
            margin: 0 auto;
            padding: 10px 16px 4px;
        }
        .walk-kicker {
            display: block;
            text-align: center;
            font-size: 0.66rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-faint);
            margin-bottom: 6px;
        }
        .walk-svg {
            display: block;
            width: 100%;
            height: auto;
            overflow: visible;
        }
        .walk-svg .walk-stop { cursor: pointer; }
        .walk-svg .walk-stop-ring { fill: rgba(10,10,18,0.85); stroke: rgba(232,182,76,0.5); stroke-width: 1.5; transition: all 0.2s; }
        .walk-svg .walk-stop:hover .walk-stop-ring { stroke: var(--accent); }
        .walk-svg .walk-stop.on .walk-stop-ring { fill: rgba(232,182,76,0.9); stroke: #fff3d6; }
        .walk-svg .walk-stop-num { font-family: 'Georgia', serif; font-size: 13px; fill: var(--text-dim); text-anchor: middle; pointer-events: none; }
        .walk-svg .walk-stop.on .walk-stop-num { fill: #231503; font-weight: bold; }
        .walk-svg .walk-stop-lens { font-family: system-ui, sans-serif; font-size: 10px; letter-spacing: 1px; fill: var(--text-dim); text-anchor: middle; pointer-events: none; }
        .walk-svg .walk-stop.on .walk-stop-lens { fill: var(--accent); }
        .walk-svg .walk-traveler { transition: cx 0.55s cubic-bezier(0.4, 0, 0.2, 1); }
        .walk-svg .walk-boundary-lbl { font-family: system-ui, sans-serif; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; text-anchor: middle; }

        .walk-now {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 10px;
            margin-top: 2px;
            min-height: 42px;
        }
        .walk-now .walk-num {
            font-family: 'Georgia', serif;
            font-size: 2.2rem;
            line-height: 1;
            color: var(--accent);
            font-weight: bold;
        }
        .walk-now .walk-name {
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-dim);

        .walk-controls {

            gap: 10px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            padding: 6px 0 4px;

// === Goethean Walk — one continuous band, seven lens stops ===
// [aesthetic] Newton's band (what light contains) above; the Goethean
// inversion (what the boundary makes) below. Where the two disagree at the
// ends, the boundary color appears: green at one seam, magenta at the other.
const WALK_DWELL = 1100;                 // per-stop dwell → both passes ≈ 15s
const BAND_X0 = 52, BAND_X1 = 668, BAND_W = BAND_X1 - BAND_X0;
const ROW_TOP_Y = 24, ROW_BOT_Y = 70, ROW_H = 30, SEAM_Y = (ROW_TOP_Y + ROW_BOT_Y + ROW_H) / 2;
const STOP_Y = 124;
const LENS_ORDER = [1, 2, 3, 4, 5, 6, 7];

let currentLens = 1;
let walking = false;
let walkInterrupted = false;

function walkStopX(i) { return BAND_X0 + (BAND_W * i / (LENS_ORDER.length - 1)); }
function spectrumHue(t) { return 0 + 280 * t; }          // red → violet
function spectrumGradient(fromHue, toHue, n) {
  const out = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const h = fromHue + (toHue - fromHue) * t;
    out.push(`<stop offset="${(t * 100).toFixed(1)}%" stop-color="hsl(${h.toFixed(0)} 84% 55%)"/>`);
  }
  return out.join('');
}

function buildWalk() {
  const svg = document.getElementById('walkSvg');
  if (!svg) return;
  let h = `<defs>
    <linearGradient id="walkNewton" x1="0%" y1="0%" x2="100%" y2="0%">${spectrumGradient(0, 280, 16)}</linearGradient>
    <linearGradient id="walkGoethe" x1="0%" y1="0%" x2="100%" y2="0%">${spectrumGradient(280, 0, 16)}</linearGradient>
    <filter id="walkGlow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>`;

  // the two arrangements of the same colors
  h += `<rect x="${BAND_X0}" y="${ROW_TOP_Y}" width="${BAND_W}" height="${ROW_H}" rx="4" fill="url(#walkNewton)" data-bg-tier="aesthetic" data-bg-source="Newton's spectrum — the colors light contains"/>`;
  h += `<rect x="${BAND_X0}" y="${ROW_BOT_Y}" width="${BAND_W}" height="${ROW_H}" rx="4" fill="url(#walkGoethe)" data-bg-tier="aesthetic" data-bg-source="Goethe's inverted spectrum — the colors at the boundary"/>`;
  h += `<text x="4" y="${ROW_TOP_Y + 20}" class="walk-boundary-lbl" text-anchor="start" fill="#8888aa">NEWTON</text>`;
  h += `<text x="4" y="${ROW_BOT_Y + 20}" class="walk-boundary-lbl" text-anchor="start" fill="#8888aa">GOETHE</text>`;

  // boundary colors at the two seams where the arrangements disagree
  h += `<circle cx="${BAND_X0}" cy="${SEAM_Y}" r="9" fill="hsl(130 70% 50%)" filter="url(#walkGlow)" data-bg-tier="aesthetic"/>`;
  h += `<text x="${BAND_X0}" y="14" class="walk-boundary-lbl" fill="hsl(130 55% 62%)">GREEN</text>`;
  h += `<circle cx="${BAND_X1}" cy="${SEAM_Y}" r="9" fill="hsl(310 70% 55%)" filter="url(#walkGlow)" data-bg-tier="aesthetic"/>`;
  h += `<text x="${BAND_X1}" y="14" class="walk-boundary-lbl" fill="hsl(310 55% 66%)">MAGENTA</text>`;

  // the traveling eye
  h += `<circle class="walk-traveler" id="walkTraveler" cx="${walkStopX(0)}" cy="${SEAM_Y}" r="0" fill="none" stroke="#fff3d6" stroke-width="2"/>`;

  // seven lens stops along the band
  LENS_ORDER.forEach((n, i) => {
    const x = walkStopX(i);
    const lens = LENSES[n];
    const hue = spectrumHue(i / (LENS_ORDER.length - 1));
    h += `<line x1="${x.toFixed(1)}" y1="${ROW_TOP_Y - 6}" x2="${x.toFixed(1)}" y2="${ROW_BOT_Y + ROW_H + 6}" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>`;
    h += `<g class="walk-stop" id="walkStop${n}" data-lens="${n}">`;
    h += `<circle class="walk-stop-ring" cx="${x.toFixed(1)}" cy="${STOP_Y}" r="12"/>`;
    h += `<text class="walk-stop-num" x="${x.toFixed(1)}" y="${STOP_Y + 5}">${n}</text>`;
    h += `<text class="walk-stop-lens" x="${x.toFixed(1)}" y="${STOP_Y + 26}">${lens.name}</text>`;
    h += `</g>`;
    h += `<circle cx="${x.toFixed(1)}" cy="${STOP_Y}" r="17" fill="transparent" data-walk-stop="${n}"/>`;
    void hue;
  });
  svg.innerHTML = h;
  svg.querySelectorAll('[data-walk-stop]').forEach(el => {
    el.addEventListener('click', () => {
      if (walking) return;
      setLens(parseInt(el.dataset.walkStop, 10));
    });
  });
}

function walkSetTraveler(n) {
  const t = document.getElementById('walkTraveler');
  if (!t) return;
  const i = LENS_ORDER.indexOf(n);
  t.setAttribute('cx', walkStopX(i < 0 ? 0 : i).toFixed(1));
}

function walkFlashBoundary(which) {
  const t = document.getElementById('walkTraveler');
  if (!t) return;
  t.setAttribute('cx', which === 'magenta' ? BAND_X1 : BAND_X0);
  t.setAttribute('stroke', which === 'magenta' ? 'hsl(310 80% 62%)' : 'hsl(130 80% 55%)');
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

async function walkSpectrum() {
  if (walking) return;
  walking = true;
  walkInterrupted = false;
  const btn = document.getElementById('walkBtn');
  const stopBtn = document.getElementById('walkStopBtn');
  const hint = document.getElementById('walkHint');
  if (btn) btn.disabled = true;
  if (stopBtn) stopBtn.disabled = false;
  const trav = document.getElementById('walkTraveler');
  if (trav) { trav.setAttribute('r', '14'); trav.setAttribute('stroke', '#fff3d6'); }

  // Pass 1 — light to dark. Ends at the green boundary.
  if (hint) hint.textContent = 'pass 1 · light → dark';
  for (let i = 0; i < LENS_ORDER.length; i++) {
    if (walkInterrupted) break;
    setLens(LENS_ORDER[i]);
    await sleep(WALK_DWELL);
  }
  if (!walkInterrupted) {
    walkFlashBoundary('green');
    if (hint) hint.textContent = 'the boundary · green';
    await sleep(900);
  }

  // Pass 2 — dark to light. Ends at the magenta boundary.
  if (!walkInterrupted) {
    if (hint) hint.textContent = 'pass 2 · dark → light';
    const trav2 = document.getElementById('walkTraveler');
    if (trav2) trav2.setAttribute('stroke', '#fff3d6');
    for (let i = LENS_ORDER.length - 1; i >= 0; i--) {
      if (walkInterrupted) break;
      setLens(LENS_ORDER[i]);
      await sleep(WALK_DWELL);
    }
  }
  if (!walkInterrupted) {
    walkFlashBoundary('magenta');
    if (hint) hint.textContent = 'the boundary · magenta';
    await sleep(900);
  }

  walking = false;
  walkInterrupted = false;
  if (btn) btn.disabled = false;
  if (stopBtn) stopBtn.disabled = true;
  const trav3 = document.getElementById('walkTraveler');
  if (trav3) trav3.setAttribute('r', '0');
  if (hint) hint.textContent = 'two passes · same corpus, seen twice';
}

function walkStopNow() {
  walkInterrupted = true;
}

// === Set lens ===
function setLens(n) {
  currentLens = n;
  const lens = LENSES[n];
  
  // Update the walk band
  document.querySelectorAll('.walk-stop').forEach(el => {
    el.classList.toggle('on', parseInt(el.dataset.lens) === n);
  });
  walkSetTraveler(n);
  document.getElementById('lensName').textContent = lens.name;
  document.getElementById('lensNum').textContent = n;
  document.getElementById('lensTitle').textContent = lens.title;
  document.getElementById('lensBody').textContent = lens.body;
  
  // Show/hide special modes
  document.getElementById('vesicaContainer').classList.toggle('show', n === 2);
  document.getElementById('focusMode').classList.toggle('show', n === 1);
  document.getElementById('categories').style.display = (n === 1) ? 'none' : 'block';
  
  if (n === 1) {
    renderFocusMode();
  } else if (n === 2) {
    renderVesicaMode();
  } else {
    renderGroupMode(lens);
  }
}

// === Render group mode (lenses 3-7) ===
function renderGroupMode(lens) {
  const container = document.getElementById('categories');
  container.innerHTML = '';
  
  // Determine which cats are in groups
  const groupedCats = new Set();
  lens.groups.forEach(g => g.cats.forEach(c => groupedCats.add(c)));
  
  // Render group headers with their categories
  lens.groups.forEach((group, gi) => {
    const groupEl = document.createElement('div');
    groupEl.style.gridColumn = '1 / -1';
    groupEl.style.padding = '12px 0 4px';
    groupEl.style.borderTop = gi > 0 ? '1px solid var(--border)' : 'none';
    groupEl.innerHTML = `<h3 style="font-size:1rem;color:var(--accent);font-weight:normal;letter-spacing:1px;">${group.label}</h3>`;
    container.appendChild(groupEl);
    
    group.cats.forEach(catName => {
      const cat = META_CATEGORIES.find(c => c.name === catName);
      if (cat) {
        container.appendChild(createCard(cat, group.label, true));
      }
    });
  });
  
  // Render obscured categories (not in any group)
  const obscured = META_CATEGORIES.filter(c => !groupedCats.has(c.name));
  if (obscured.length > 0) {
    const obsHeader = document.createElement('div');
    obsHeader.style.gridColumn = '1 / -1';
    obsHeader.style.padding = '12px 0 4px';
    obsHeader.style.borderTop = '1px solid var(--border)';
    obsHeader.innerHTML = `<h3 style="font-size:0.85rem;color:var(--text-faint);font-style:italic;">Obscured — no slot in this lens</h3>`;
    container.appendChild(obsHeader);
    
    obscured.forEach(cat => {
      container.appendChild(createCard(cat, null, false));
    });
  }
  
  updateStats(lens.groups.length, groupedCats.size);
}

// === Create category card ===
function createCard(cat, groupLabel, revealed) {
  const card = document.createElement('div');
  card.className = 'cat-card ' + (revealed ? 'revealed' : 'obscured');
  card.innerHTML = `
    <h3>${cat.name}</h3>
    <div class="count">${cat.count.toLocaleString()} documents</div>
    ${groupLabel ? `<div class="lens-label">${groupLabel}</div>` : '<div class="lens-label" style="color:var(--text-faint)">— obscured —</div>'}
  `;
  return card;
}

// === Focus mode (lens 1) ===
function renderFocusMode() {
  const select = document.getElementById('focusSelect');
  select.innerHTML = '<option value="">— Pick a category to zoom into —</option>' +
    META_CATEGORIES.map(c => `<option value="${c.name}">${c.name} (${c.count})</option>`).join('');
  
  document.getElementById('focusResults').innerHTML = 
    '<p style="text-align:center;color:var(--text-dim);font-size:0.85rem;padding:20px;">Choose a category above. The archive will collapse to just that one view.</p>';
  
  updateStats(1, 1);
}

// === Vesica mode (lens 2) ===
function renderVesicaMode() {
  const leftSel = document.getElementById('vesicaLeft');
  const rightSel = document.getElementById('vesicaRight');
  
  const options = META_CATEGORIES.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
  leftSel.innerHTML = options;
  rightSel.innerHTML = options;
  
  // Default: pick two interesting ones
  leftSel.value = "Aether, Light & Electricity";
  rightSel.value = "Water Structure & Memory";
  
  updateVesicaDisplay();
  
  leftSel.onchange = updateVesicaDisplay;
  rightSel.onchange = updateVesicaDisplay;
  
  // Render all categories with partial opacity
  const container = document.getElementById('categories');
  container.innerHTML = '';
  META_CATEGORIES.forEach(cat => {
    const inLeft = cat.name === leftSel.value;
    const inRight = cat.name === rightSel.value;
    const inBoth = inLeft && inRight;
    const cls = inBoth ? 'revealed' : (inLeft || inRight ? 'partial' : 'obscured');
    const card = document.createElement('div');
    card.className = 'cat-card ' + cls;
    let label = '';
    if (inBoth) label = '◆ In the vesica — both lenses';
    else if (inLeft) label = 'Left lens only';
    else if (inRight) label = 'Right lens only';
    else label = '— obscured —';
    card.innerHTML = `
      <h3>${cat.name}</h3>
      <div class="count">${cat.count.toLocaleString()} documents</div>
      <div class="lens-label" style="color:${inBoth ? 'var(--accent)' : 'var(--text-faint)'}">${label}</div>
    `;
    container.appendChild(card);
  });
  
  updateStats(2, 2);
}

function updateVesicaDisplay() {
  const leftVal = document.getElementById('vesicaLeft').value;
  const rightVal = document.getElementById('vesicaRight').value;
  document.getElementById('vesicaLeftLabel').textContent = leftVal.substring(0, 20);
  document.getElementById('vesicaRightLabel').textContent = rightVal.substring(0, 20);
  
  const intersection = leftVal === rightVal ? leftVal : 'shared boundary';
  document.getElementById('vesicaOverlap').textContent = intersection;
  
  // Update cards
  document.querySelectorAll('.cat-card').forEach((card, i) => {
    const cat = META_CATEGORIES[i];
    const inLeft = cat.name === leftVal;
    const inRight = cat.name === rightVal;
    const inBoth = inLeft && inRight;
    card.className = 'cat-card ' + (inBoth ? 'revealed' : (inLeft || inRight ? 'partial' : 'obscured'));
    const labelEl = card.querySelector('.lens-label');
    if (inBoth) { labelEl.textContent = '◆ In the vesica — both lenses'; labelEl.style.color = 'var(--accent)'; }
    else if (inLeft) { labelEl.textContent = 'Left lens only'; labelEl.style.color = 'var(--text-dim)'; }
    else if (inRight) { labelEl.textContent = 'Right lens only'; labelEl.style.color = 'var(--text-dim)'; }
    else { labelEl.textContent = '— obscured —'; labelEl.style.color = 'var(--text-faint)'; }
  });
}

// === Stats ===
function updateStats(visibleCats, totalVisible) {
  document.getElementById('statVisible').textContent = totalVisible;
}

// === Init ===
buildWalk();
setLens(1);
document.getElementById('walkBtn').addEventListener('click', walkSpectrum);
document.getElementById('walkStopBtn').addEventListener('click', walkStopNow);
</script>
